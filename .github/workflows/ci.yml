name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build distributable skills
        run: python tools/build.py
      - name: Check generated files match their sources
        run: |
          git diff --exit-code -- skills/ ':!skills/.generated.json'
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          committed = json.loads(subprocess.check_output(
              ['git', 'show', 'HEAD:skills/.generated.json']))
          rebuilt = json.loads(Path('skills/.generated.json').read_text())
          assert committed == rebuilt, 'Generated file hashes or package metadata changed'
          PY
